<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151b18" />
    <meta name="description" content="在一个看板里关注哔哩哔哩、斗鱼、虎牙和抖音的直播状态。纯静态页面，无需后端，关注列表保存在本地浏览器。" />
    <link rel="icon" href="./src/assets/hsu-logo.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="./src/assets/hsu-logo.jpg" />
    <title>Hsu · 直播航班板</title>
    <script>
      (() => {
        const storageKey = 'hsu-live-theme'
        let theme = 'dark'
        try {
          const stored = window.localStorage.getItem(storageKey)
          theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#151b18' : '#f6f7f5')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
